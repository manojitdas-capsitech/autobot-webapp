services:
  - type: web
    name: github-automation-bot
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: MONGO_DB_URL
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
