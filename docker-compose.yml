version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      - PORT=3000
      - ML_SERVICE_URL=http://ml:5000/predict  
    depends_on:
      - mongo
    working_dir: /app
    command: ["npm", "run", "start"]

  ml:
    build:
      context: ./ml-labeler
      dockerfile: Dockerfile
    ports:
      - "5050:5000"
    expose:
      - "5000"

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
